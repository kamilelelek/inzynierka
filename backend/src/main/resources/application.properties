spring.application.name=smarthome-backend

# --- Baza danych ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smarthome}
spring.datasource.username=${DB_USERNAME:smarthome}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- MQTT ---
smarthome.mqtt.broker-url=${MQTT_BROKER_URL:tcp://raspberrypi.local:1883}
smarthome.mqtt.client-id=${MQTT_CLIENT_ID:smarthome-backend}
smarthome.mqtt.username=${MQTT_USERNAME:}
smarthome.mqtt.password=${MQTT_PASSWORD:}
smarthome.mqtt.hub-id=hub1

# --- JWT ---
smarthome.jwt.secret=${JWT_SECRET:}
smarthome.jwt.expiration=1h

# --- Grzałka ---
# Backend musi ponawiać komendę heater/set częściej niż HEATER_COMMAND_TIMEOUT_S na Pi (30 s)
smarthome.heater.command-refresh-ms=10000
